services:
  apache:
    build: ./apache
    container_name: apache
    ports:
      - "80:80"
      - "443:443"
  depends_on:
    - php
  networks:
    - appnet
  volumes:
    - ./html:/var/www/html:ro

  php:
    build: ./php
    container_name: php_fpm
    volumes:
      - ./html:/var/www/html
    networks:
      - appnet
    healthcheck:
      test: ["CMD", "php", "-v"]
      interval: 30s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_USER: richardp
      POSTGRES_PASSWORD: Password1!
      POSTGRES_DB: postgresdb
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - appnet

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@localhost.com
      PGADMIN_DEFAULT_PASSWORD: Password1!
    ports:
      - "8082:80"
    depends_on:
      - postgres
    networks:
      - appnet

networks:
  appnet:
  
volumes:
  pgdata:
